    current_value: "GPT-6 Astra（2026-09-03、$10/$50、サイバー能力は Daybreak 経由）／GPT-6 Sol・Luna（09-22）／GPT-6.1 Sol（09-29 DevDay）／GPT-6.1 Terra（10-26）／GPT-6 Rosalind（10-30、承認組織のみ）。GPT-5.5 は 2026-10-14 に ChatGPT から引退。GPT-6.1 Astra は公開見送りと報道。すべて検索経由（OpenAI 公式は環境の制限で直接取得不可）"
    last_checked: 2026-11-06
    recheck_days: 90
    source: OpenAI 公式ドキュメント（Models）
    url: https://developers.openai.com/api/docs/models
    pattern: 'GPT-?\d(\.\d)?'
    exclude_categories: [history]
    note: 本書では 26 件が GPT の世代名に触れている。世代交代時の影響が最も大きい

  - id: F-model-openai-reasoning
