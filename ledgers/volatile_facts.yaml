# 時変ファクト watchlist（手で編集する定義ファイル）
#
# 「最新の Claude は何か」「ChatGPT の月額はいくらか」のような事実は、
# 1 つ変わるだけで複数のエントリが同時に古くなります。GPT 系の記述は 26 件、
# Gemini 系は 12 件、価格の記述は 18 件に散っていて、エントリを 1 件ずつ
# 巡回する方式では取りこぼします。
#
# そこで **事実の側を台帳の主語にします**。ここに事実を 1 行で定義しておけば、
# scripts/update_volatile_facts.py が本文を走査して「その事実に依存している
# エントリ」を自動で集め、ledgers/volatile_facts.md に一覧を書き出します。
# 事実が 1 つ動いたら、影響範囲が即座に引けます。
#
# 編集するのはこのファイルだけです（.md は自動生成なので手で触らないこと）。
#
# 各フィールド:
#   id            … F-<種別>-<対象> の形。台帳と監査ログから参照する識別子
#   label         … 人が読む名前
#   kind          … model / pricing / benchmark / spec / availability
#   book_says     … **本書が現在どう書いているか**。事実そのものではなく本書の主張を書く
#   current_value … 最後の確認で分かった実際の値。未確認なら空のまま
#   last_checked  … 最後に一次情報を見た日（YYYY-MM-DD）。空＝未確認
#   recheck_days  … 再確認の間隔の目安
#   source        … 確認先（名前）
#   url           … 確認先 URL。初回監査で実在を確かめて直すこと（未検証のまま置いています）
#   pattern       … 本文からこの事実に依存するエントリを拾う正規表現（Python re）
#   include_categories … 指定すると、この category のエントリだけに絞る（任意）
#   exclude_categories … この category を除く（任意）。例: 歴史エントリは世代交代で古くならない
#   exclude_ids   … 個別に除くエントリ ID（任意）
#   note          … 確認するときの注意
#
# 2026-09-19 新設。

facts:
  # ─── モデル世代 ─────────────────────────────────
  - id: F-model-anthropic
    label: Anthropic の最新モデル世代
    kind: model
    book_says: "D-13「Claude 4.5 系」を現行の主力、D-14「Claude Mythos Preview」を先行版として扱う"
    current_value: "Claude 5 世代が現行。Opus 5（1M 文脈）／Sonnet 5／Fable 5.1／Mythos 5.1。Opus 4.8 は 2026-05-28 公開。本書が現行とする 4.5〜4.7 は既に過去世代"
    last_checked: 2026-09-19
    recheck_days: 90
    source: Anthropic 公式ドキュメント（モデル一覧）
    url: https://docs.anthropic.com/en/docs/about-claude/models/overview
    pattern: 'Claude\s*(Opus|Sonnet|Haiku)?\s*\d(\.\d)?'
    exclude_categories: [history]
    note: 世代が増えたら D 章に新エントリが要る。旧世代の deprecated 化も同時に確認する

  - id: F-model-openai
    label: OpenAI の最新モデル世代（GPT 系）
    kind: model
    book_says: "D-20「GPT-5 系」を現行、D-21「GPT-4 系」以前を過去世代として扱う"
    current_value: "GPT-6 Astra がフラッグシップ。GPT-5.6 系は Sol／Terra／Luna の 3 構成、ほかに GPT-5.3-Codex・GPT-5.4／5.5 系。本書が現行とする GPT-5 系は過去世代"
    last_checked: 2026-09-19
    recheck_days: 90
    source: OpenAI 公式ドキュメント（Models）
    url: https://developers.openai.com/api/docs/models
    pattern: 'GPT-?\d(\.\d)?'
    exclude_categories: [history]
    note: 本書では 26 件が GPT の世代名に触れている。世代交代時の影響が最も大きい

  - id: F-model-openai-reasoning
    label: OpenAI の推論モデル系列（o シリーズ）
    kind: model
    book_says: "D-22「o1 系」・D-23「o3 系」を収録。o3 系が最新として書かれている"
    current_value: "o1-preview は 2025-07-28、o1-mini は 2025-10-27 に API から削除済み。o3 は 2026-08-26 に ChatGPT から引退、API 側も 2026-12-11 削除予定。推論は GPT-5 以降の本流モデルに統合された"
    last_checked: 2026-09-19
    recheck_days: 90
    source: OpenAI 公式ドキュメント（Models）
    url: https://developers.openai.com/api/docs/deprecations
    pattern: '(?<![A-Za-z])o\d(?![A-Za-z0-9])'
    exclude_categories: [history]
    note: 通常モデルへの推論機能統合が進むと、系列そのものの位置づけが変わる

  - id: F-model-google
    label: Google の最新モデル世代（Gemini 系）
    kind: model
    book_says: "D-4「Gemini 3.1 系」を現行、D-1〜D-3 を過去世代として扱う"
    current_value: "Gemini 3.8 Flash まで到達。3.5 Flash／3.5 Flash-Lite／3.6 Flash／3.7 Flash が GA。本書の最新収録は D-4 Gemini 3.1 系で、3.5 以降が未収録"
    last_checked: 2026-09-19
    recheck_days: 90
    source: Google AI 公式ドキュメント（Gemini models）
    url: https://ai.google.dev/gemini-api/docs/models
    pattern: 'Gemini\s*\d(\.\d)?'
    exclude_categories: [history]
    note: 旧 3 桁 ID の残骸（201 番）も Gemini 2.5 を扱っているので併せて確認する

  - id: F-model-meta
    label: Meta のオープンウェイトモデル（Llama 系）
    kind: model
    book_says: "D-40「Llama 系」で Llama 1〜4 の系譜を扱う"
    current_value: ""
    last_checked: ""
    recheck_days: 180
    source: Meta Llama 公式サイト
    url: https://www.llama.com/
    pattern: 'Llama\s*\d'
    exclude_categories: [history]
    note: ライセンス条項の変更もここで拾う（商用利用の条件は本書の説明に効く）

  - id: F-spec-context-length
    label: 主要モデルのコンテキスト長
    kind: spec
    book_says: "「◯万トークン」「◯K トークン」の具体数値が複数エントリに入っている"
    current_value: ""
    last_checked: ""
